<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>catOS</title>
    <link rel="icon" href="kitten-lying-in-blanket.jpg">
    <link rel="stylesheet" href="styles.css">
    <!-- order matters: wm.js first, then the apps, then main.js boots everything -->
    <script src="wm.js" defer></script>
    <script src="apps.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>

<div id="wallpaper"></div>
<div id="desktop" aria-label="Desktop"></div>
<div id="windows"></div>

<div id="start-menu" hidden>
    <div class="sm-banner"><span><b>cat</b>OS 98</span></div>
    <div class="sm-items">
        <div id="start-apps"></div>
        <hr class="sm-sep">
        <button class="sm-item" id="power-btn">
            <span class="icon">
                <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="24" height="17" fill="#c0c0c0" stroke="#000"/><rect x="7" y="9" width="18" height="11" fill="#000080"/><rect x="11" y="23" width="10" height="3" fill="#808080" stroke="#000"/><rect x="7" y="26" width="18" height="2" fill="#c0c0c0" stroke="#000"/></svg>
            </span>
            <span>Sh<u>u</u>t Down...</span>
        </button>
    </div>
</div>

<nav id="taskbar" aria-label="Taskbar">
    <button class="start-btn" id="start-btn" aria-label="Start">
        <img src="awsmaine_CATkitty0125-scaled.jpg" alt="">
        <b>Start</b>
    </button>
    <span class="tb-divider" aria-hidden="true"></span>
    <div id="taskbar-apps"></div>
    <div class="tray">
        <button id="show-desktop" title="Show desktop" aria-label="Show desktop">
            <svg viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="2" width="14" height="10" fill="#008080" stroke="#000"/><rect x="5" y="12" width="6" height="2" fill="#808080"/><rect x="3" y="14" width="10" height="1" fill="#000"/></svg>
        </button>
        <span id="clock"></span>
    </div>
</nav>

<div id="shutdown" hidden>
    <p>It's now safe to turn off your cat.</p>
    <button id="restart-btn">Restart</button>
</div>

</body>
</html>
